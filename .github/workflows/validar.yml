name: Validar entrega SIA

# Red de seguridad de la cadena de publicación. Comprueba lo que hasta ahora
# dependía solo de la disciplina de quien edita:
#   1. que el JavaScript inline de index.html sea sintácticamente válido
#   2. que sw.js sea válido
#   3. que CACHE_VERSION se haya bumpeado cuando index.html o sw.js cambian
#      (sin ese bump el navegador sigue sirviendo el index.html viejo: cache-first)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extraer y validar el JavaScript inline de index.html
        run: |
          sed -n '/^<script>$/,/^<\/script>$/p' index.html | sed '1d;$d' > /tmp/sia_inline.js
          test -s /tmp/sia_inline.js || { echo "::error::No se pudo extraer el <script> inline"; exit 1; }
          node --check /tmp/sia_inline.js
          echo "JavaScript inline valido ($(wc -l < /tmp/sia_inline.js) lineas)"

      - name: Validar sw.js
        run: node --check sw.js

      - name: Verificar que CACHE_VERSION se haya bumpeado
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qE '^(index\.html|sw\.js)$'; then
            antes=$(git show "$base:sw.js" | grep -oP "CACHE_VERSION = '\K[^']+" || echo "")
            ahora=$(grep -oP "CACHE_VERSION = '\K[^']+" sw.js)
            echo "antes=$antes  ahora=$ahora"
            if [ "$antes" = "$ahora" ]; then
              echo "::error::index.html o sw.js cambiaron pero CACHE_VERSION sigue en '$ahora'. Bumpeala (formato sia-v35-AAAA-MM-DD<letra>) o el navegador servira la version anterior."
              exit 1
            fi
          fi

      - name: Verificar los GeoJSON
        run: |
          for f in data/*.geojson; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "::error::$f no es JSON valido"; exit 1; }
          done
          echo "Los $(ls data/*.geojson | wc -l) GeoJSON son JSON valido"

      - name: Verificar el invariante del inventario (66 areas)
        run: |
          node -e "
            const fc = JSON.parse(require('fs').readFileSync('data/geometrias.geojson','utf8'));
            const c = {};
            fc.features.forEach(f => { const g = f.properties.grupo; c[g] = (c[g]||0) + 1; });
            const esperado = {'AVA · Bosque Urbano':13,'AVA · Barranca':26,'ANP · Local':18,'ANP · Federal':9};
            let ok = fc.features.length === 66;
            for (const [k,v] of Object.entries(esperado)) if (c[k] !== v) ok = false;
            console.log('total', fc.features.length, JSON.stringify(c));
            if (!ok) { console.error('::error::El inventario dejo de ser 66 = 13 BU + 26 Barranca + 18 ANP Local + 9 ANP Federal'); process.exit(1); }
            console.log('Invariante de 66 areas: OK');
          "
